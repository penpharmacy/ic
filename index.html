<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกมเปิดกล่องสุ่มตัวเลข</title>
    <style>
        body { font-family: 'Kanit', sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: white; padding: 2rem; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 90%; max-width: 500px; text-align: center; }
        h1 { color: #333; }
        textarea { width: 100%; height: 80px; padding: 10px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 10px; resize: none; font-size: 16px; box-sizing: border-box; }
        .btn-setup { background: #6c757d; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin-bottom: 20px; }
        .box-area { background: #e9ecef; border: 3px dashed #ced4da; border-radius: 15px; padding: 40px; margin: 20px 0; min-height: 100px; display: flex; justify-content: center; align-items: center; }
        #resultDisplay { font-size: 4rem; font-weight: bold; color: #ff4757; }
        .btn-spin { background: #28a745; color: white; border: none; padding: 15px 40px; border-radius: 50px; font-size: 1.2rem; cursor: pointer; box-shadow: 0 4px 15px rgba(40, 167, 69, 0.3); transition: 0.3s; }
        .btn-spin:disabled { background: #ccc; cursor: not-allowed; }
        .status { margin-top: 15px; color: #666; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎁 กล่องสุ่มนำโชค</h1>
    
    <div id="setup-section">
        <p>ใส่ตัวเลขที่ต้องการสุ่ม (แยกด้วยช่องว่าง)</p>
        <textarea id="numberInput" placeholder="ตัวอย่าง: 10 25 30 88 99"></textarea>
        <button class="btn-setup" onclick="setupGame()">ตั้งค่าเริ่มต้น</button>
    </div>

    <div id="game-section" style="display:none;">
        <div class="box-area">
            <div id="resultDisplay">?</div>
        </div>
        <button id="spinBtn" class="btn-spin" onclick="spin()">เปิดกล่องสุ่ม!</button>
        <div class="status">เหลือเลขในกล่อง: <span id="countDisplay">0</span> ตัว</div>
        <button class="btn-setup" style="margin-top:20px; background:#ff4757;" onclick="resetGame()">ล้างค่าใหม่</button>
    </div>
</div>

<script>
    let luckyNumbers = [];
    let currentPick = null;

    function setupGame() {
        const input = document.getElementById('numberInput').value;
        luckyNumbers = input.trim().split(/\s+/).filter(n => n !== "");
        
        if (luckyNumbers.length === 0) {
            alert("กรุณาใส่ตัวเลขอย่างน้อย 1 ตัว");
            return;
        }
        
        updateUI();
        document.getElementById('setup-section').style.display = 'none';
        document.getElementById('game-section').style.display = 'block';
    }

    function spin() {
        if (luckyNumbers.length === 0) {
            alert("ไม่มีเลขเหลือให้สุ่มแล้ว!");
            return;
        }

        const spinBtn = document.getElementById('spinBtn');
        const display = document.getElementById('resultDisplay');
        spinBtn.disabled = true;

        // Effect สุ่มวิ่ง
        let counter = 0;
        let interval = setInterval(() => {
            let tempIdx = Math.floor(Math.random() * luckyNumbers.length);
            display.innerText = luckyNumbers[tempIdx];
            counter++;
            
            if (counter > 15) {
                clearInterval(interval);
                finalizeSpin();
            }
        }, 50);
    }

    function finalizeSpin() {
        const idx = Math.floor(Math.random() * luckyNumbers.length);
        currentPick = luckyNumbers[idx];
        document.getElementById('resultDisplay').innerText = currentPick;

        setTimeout(() => {
            if (confirm(`คุณสุ่มได้เลข: ${currentPick}\n\nต้องการลบตัวเลขนี้ออกจากกล่องหรือไม่?`)) {
                luckyNumbers.splice(idx, 1);
                alert("ลบออกเรียบร้อยแล้ว");
            }
            updateUI();
            document.getElementById('spinBtn').disabled = false;
        }, 500);
    }

    function updateUI() {
        document.getElementById('countDisplay').innerText = luckyNumbers.length;
        if (luckyNumbers.length === 0) {
            document.getElementById('resultDisplay').innerText = "หมด";
            document.getElementById('spinBtn').disabled = true;
        }
    }

    function resetGame() {
        document.getElementById('setup-section').style.display = 'block';
        document.getElementById('game-section').style.display = 'none';
        document.getElementById('resultDisplay').innerText = "?";
        document.getElementById('spinBtn').disabled = false;
    }
</script>

</body>
</html>
